<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11152f">
  <meta name="description" content="Una aventura visual para estudiar EDA: explora Ciudad Delta con Byte, resuelve ejercicios y recupera sus cinco zonas.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EDA Quest">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>EDA Quest · Ciudad Delta</title>
  <script>
    try {
      const t = localStorage.getItem('eda_theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="polish.css">
  <script src="content.js" defer></script>
  <script src="challenges.js" defer></script>
  <script src="visuals.js" defer></script>
  <script src="campaign.js" defer></script>
  <script src="exercise-visuals.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="nav" data-page="map" aria-label="EDA Quest, volver al mapa">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 25V16h5v9M14 25V10h5v15M23 25V5h5v20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></span>
        <span>EDA<span class="brand-light">QUEST</span><small>CIUDAD DELTA</small></span>
      </button>
      <div class="top-actions">
        <span class="xp-pill" id="header-xp" aria-label="Experiencia total">0 XP</span>
        <button class="icon-btn" id="sound-button" data-action="sound" aria-label="Activar sonidos" aria-pressed="false"></button>
        <button class="icon-btn" id="theme-button" data-action="theme" aria-label="Cambiar a modo claro"></button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Navegación principal">
      <button data-action="nav" data-page="map" aria-current="page"><span data-icon="map"></span><span>Mapa</span></button>
      <button data-action="nav" data-page="theory"><span data-icon="book"></span><span>Teoría</span></button>
      <button data-action="nav" data-page="practice"><span data-icon="bolt"></span><span>Practicar</span></button>
      <button data-action="nav" data-page="profile"><span data-icon="badge"></span><span>Perfil</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="celebration" aria-hidden="true"></div>
  <noscript><p class="noscript">Activa JavaScript en tu navegador para jugar a EDA Quest.</p></noscript>
</body>
</html>
